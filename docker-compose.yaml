services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    hostname: namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: datasets
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
      HDFS_CONF_dfs_webhdfs_enabled: "true"
    ports:
      - "9870:9870"   # interfaz web: http://localhost:9870
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./datasets:/datasets                  # carpeta de tu PC con el CSV

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    hostname: datanode
    restart: unless-stopped
    depends_on:
      - namenode
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
      HDFS_CONF_dfs_replication: "1"
      HDFS_CONF_dfs_permissions_enabled: "false"
    ports:
      - "9864:9864"
      - "9866:9866"
    volumes:
      - datanode_data:/hadoop/dfs/data

  spark:
    image: apache/spark:4.0.0                 # debe coincidir con la version de pyspark del cliente
    container_name: spark
    hostname: spark
    restart: unless-stopped
    depends_on:
      - namenode
      - datanode
    environment:
      SPARK_NO_DAEMONIZE: "true"              # mantiene el servidor en primer plano
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --master
      - local[2]
      - --driver-memory
      - 4g
      - --conf
      - spark.sql.shuffle.partitions=8
      - --conf
      - spark.hadoop.fs.defaultFS=hdfs://namenode:9000
      - --conf
      - spark.jars.ivy=/tmp/.ivy2             # carpeta escribible para descargar los drivers
      - --packages                            # drivers JDBC (PostgreSQL) y conector MongoDB
      - org.postgresql:postgresql:42.7.4,org.mongodb.spark:mongo-spark-connector_2.13:10.5.0
    ports:
      - "15002:15002"   # Spark Connect: sc://localhost:15002
      - "4040:4040"     # interfaz web de Spark

  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartcities
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # crea las tablas la primera vez

  mongo:
    image: mongo:7
    container_name: mongo
    hostname: mongo
    restart: unless-stopped
    ports:
      - "27018:27017"   
    volumes:
      - mongo_data:/data/db

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  mongo_data: